services:
  - type: web
    name: seesay
    runtime: node
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: seesay-db
          property: connectionString
      - key: APP_URL
        fromService:
          type: web
          name: seesay
          property: host

databases:
  - name: seesay-db
    plan: free
    databaseName: seesay
    user: seesay
